services:
  quicknotes:
    build: ./app
    image: quicknotes:lab6
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATA_PATH: /data/notes.json
      SEED_PATH: /app/seed.json
    volumes:
      - quicknotes-data:/data
    healthcheck:
      # exec form: distroless has no shell, so run our own static probe binary
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

    # --- Bonus: security defaults ---
    user: "65532:65532"          # nonroot (also set in the Dockerfile)
    cap_drop: [ALL]              # QuickNotes needs no Linux capabilities
    read_only: true              # root filesystem is read-only
    tmpfs:
      - /tmp                     # scratch space; /data is the volume
    security_opt:
      - no-new-privileges:true

volumes:
  quicknotes-data:
