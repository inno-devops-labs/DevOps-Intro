services:
  quicknotes:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: quicknotes:lab6

    ports:
      - "8080:8080"

    environment:
      ADDR: ":8080"
      DATA_PATH: "/data/notes.json"
      SEED_PATH: "/app/seed.json"

    volumes:
      - quicknotes-data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

volumes:
  quicknotes-data: