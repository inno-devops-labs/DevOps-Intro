services:
  quicknotes:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: quicknotes:lab6

    ports:
      - "8080:8080"

    environment:
      ADDR: ":8080"
      DATA_PATH: "/data/notes.json"
      SEED_PATH: "/seed.json"

    volumes:
      - quicknotes-data:/data

    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s

    restart: unless-stopped

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    security_opt:
      - no-new-privileges:true

volumes:
  quicknotes-data:
