services:
  quicknotes:
    build:
      context: ./app
    image: quicknotes:lab6

    ports:
      - "8080:8080"

    environment:
      ADDR: ":8080"
      DATA_PATH: "/data/notes.json"
      SEED_PATH: "/app/seed.json"

    volumes:
      - quicknotes-data:/data

    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    restart: unless-stopped

    cap_drop:
      - ALL

    read_only: true

    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.7.1

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro

    depends_on:
      quicknotes:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.2

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_PATHS_PROVISIONING: /opt/grafana-config/provisioning

    volumes:
      - ./monitoring/grafana:/opt/grafana-config:ro

    depends_on:
      - prometheus

volumes:
  quicknotes-data: