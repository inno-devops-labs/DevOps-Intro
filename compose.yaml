# Lab 6 — QuickNotes Compose (volume + healthcheck + hardening bonus)
services:
  quicknotes:
    build: ./app
    image: quicknotes:lab6
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      DATA_PATH: "/data/notes.json"
      SEED_PATH: "/seed.json"
    volumes:
      - quicknotes-data:/data
    # Writable space under read-only rootfs (app mainly writes to /data volume)
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      # Distroless has no shell/wget — use the static /healthcheck binary from the image
      test: ["CMD", "/healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s

volumes:
  quicknotes-data:
