name: CI

on:
  push:
    branches: [main, feature/lab9]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: '-buildvcs=false'

defaults:
  run:
    working-directory: app

jobs:
  vet:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.24']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            app/go.mod
            app/go.sum
      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23', '1.24']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            app/go.mod
            app/go.sum
      - name: Test with race detector
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect lint-relevant changes
        id: lint-changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          run_lint=true
          from=""
          to=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$EVENT_ACTION" == "synchronize" && -n "$BEFORE_SHA" && -n "$AFTER_SHA" ]]; then
              from="$BEFORE_SHA"
              to="$AFTER_SHA"
            fi
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" ]]; then
            from="$BEFORE_SHA"
            to="$CURRENT_SHA"
          fi

          if [[ -n "$from" && -n "$to" && ! "$from" =~ ^0+$ ]]; then
            if git cat-file -e "${from}^{commit}" 2>/dev/null && git cat-file -e "${to}^{commit}" 2>/dev/null; then
              if git diff --quiet "$from" "$to" -- app ':(exclude)app/*.md' ':(exclude)app/**/*.md'; then
                run_lint=false
              fi
            fi
          fi

          echo "run_lint=$run_lint" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.lint-changes.outputs.run_lint == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: |
            app/go.mod
            app/go.sum
      - name: Lint
        if: steps.lint-changes.outputs.run_lint == 'true'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.5.0
          working-directory: app
          skip-cache: false
      - name: Skip lint for documentation-only changes
        if: steps.lint-changes.outputs.run_lint != 'true'
        working-directory: .
        run: echo "No lint-relevant app changes in this update; skipping golangci-lint."

  govulncheck:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: go1.26.6
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go 1.24
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: |
            app/go.mod
            app/go.sum
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Check Go vulnerabilities
        run: |
          "$(go env GOPATH)/bin/govulncheck" -version
          "$(go env GOPATH)/bin/govulncheck" ./...

  ci-ok:
    if: ${{ always() }}
    needs: [vet, test, lint, govulncheck]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks to succeed
        working-directory: .
        env:
          VET_RESULT: ${{ needs.vet.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          GOVULNCHECK_RESULT: ${{ needs.govulncheck.result }}
        run: |
          test "$VET_RESULT" = success
          test "$TEST_RESULT" = success
          test "$LINT_RESULT" = success
          test "$GOVULNCHECK_RESULT" = success
