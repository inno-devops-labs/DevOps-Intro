name: QuickNotes CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  GOFLAGS: -buildvcs=false

jobs:
  vet:
    name: vet (${{ matrix.go-version }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.23'
          - '1.24'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: app/go.mod

      - name: Run go vet
        working-directory: app
        run: go vet ./...

  test:
    name: test (${{ matrix.go-version }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.23'
          - '1.24'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: app/go.mod

      - name: Run tests
        working-directory: app
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect whether lint is needed
        id: lint-changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          changed_files="$(git diff --name-only "$BASE" "$HEAD")"

          echo "Changed files:"
          echo "$changed_files"

          run_lint=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" == ".github/workflows/ci.yml" ]]; then
              run_lint=true
              break
            fi

            if [[ "$file" == app/* && "$file" != *.md ]]; then
              run_lint=true
              break
            fi
          done <<< "$changed_files"

          echo "run_lint=$run_lint" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.lint-changes.outputs.run_lint == 'true'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: app/go.mod

      - name: Restore golangci-lint binary
        id: lint-bin-cache
        if: steps.lint-changes.outputs.run_lint == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-${{ runner.os }}-go1.24-v2.5.0

      - name: Install golangci-lint
        if: steps.lint-changes.outputs.run_lint == 'true' && steps.lint-bin-cache.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0

      - name: Run golangci-lint
        if: steps.lint-changes.outputs.run_lint == 'true'
        working-directory: app
        run: ~/go/bin/golangci-lint run

      - name: Skip lint for docs-only changes
        if: steps.lint-changes.outputs.run_lint != 'true'
        run: echo "Only Markdown documentation under app/ changed; lint skipped."


  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: app/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        working-directory: app
        run: ~/go/bin/govulncheck ./...


  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - vet
      - test
      - lint
      - govulncheck
    runs-on: ubuntu-24.04

    steps:
      - name: Check CI results
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
