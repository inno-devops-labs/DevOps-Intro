# Lab 7 inventory - targets the Lab 5 Vagrant VM over SSH.
#
# The Ansible controller runs ON the VM itself (Windows cannot run Ansible
# natively), so the target is the VM's own sshd: 127.0.0.1:22. The key is the
# exact Vagrant-generated private key that `vagrant ssh-config` prints on the
# host (IdentityFile) - from inside the VM the same file is visible via the
# synced folder at /vagrant/.vagrant/machines/default/virtualbox/private_key.
#
# Host-side evidence (run on the host, paste into the report):
#   vagrant ssh-config
#   -> HostName 127.0.0.1, Port 2222, User vagrant, IdentityFile ...private_key
# The 2222 mapping is only needed when connecting FROM the host; from inside
# the VM sshd is reachable directly on port 22.

[quicknotes]
vm ansible_host=127.0.0.1 ansible_port=22 ansible_user=vagrant ansible_ssh_private_key_file=/home/vagrant/.ssh/lab7_key ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
