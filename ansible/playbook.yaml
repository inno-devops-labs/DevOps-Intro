---
- name: Deploy QuickNotes
  hosts: quicknotes
  become: true
  gather_facts: false
  vars:
    quicknotes_user: quicknotes
    quicknotes_group: quicknotes
    data_dir: /var/lib/quicknotes
    binary_path: /usr/local/bin/quicknotes
    seed_path: /var/lib/quicknotes/seed.json
    data_path: /var/lib/quicknotes/notes.json
    listen_addr: ":8080"
    restart_sec: "2s"
  tasks:
    - name: Create QuickNotes system group
      ansible.builtin.group:
        name: "{{ quicknotes_group }}"
        system: true

    - name: Create QuickNotes system user
      ansible.builtin.user:
        name: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ data_dir }}"
        create_home: false

    - name: Create QuickNotes data directory
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        mode: '0750'

    - name: Install QuickNotes binary
      ansible.builtin.copy:
        src: files/quicknotes
        dest: "{{ binary_path }}"
        owner: root
        group: root
        mode: '0755'
      notify: restart quicknotes

    - name: Install seed notes
      ansible.builtin.copy:
        src: files/seed.json
        dest: "{{ seed_path }}"
        owner: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        mode: '0640'

    - name: Install QuickNotes systemd unit
      ansible.builtin.template:
        src: templates/quicknotes.service.j2
        dest: /etc/systemd/system/quicknotes.service
        owner: root
        group: root
        mode: '0644'
      notify: restart quicknotes

    - name: Enable and start QuickNotes
      ansible.builtin.systemd_service:
        name: quicknotes
        daemon_reload: true
        enabled: true
        state: started

  handlers:
    - name: restart quicknotes
      ansible.builtin.systemd_service:
        name: quicknotes
        daemon_reload: true
        state: restarted
