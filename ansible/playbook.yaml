---
- name: Deploy QuickNotes
  hosts: quicknotes
  become: true
  gather_facts: false

  vars:
    listen_addr: ":8080"
    data_dir: "/var/lib/quicknotes"
    data_path: "/var/lib/quicknotes/notes.json"
    seed_path: "/var/lib/quicknotes/seed.json"
    restart_backoff: "4s"

    ansible_pull_repo: "https://github.com/fsstilerr/DevOps-Intro.git"
    ansible_pull_branch: "feature/lab7"
    ansible_pull_inventory: "/etc/ansible/quicknotes-local.ini"
    ansible_pull_checkout: "/var/lib/ansible-pull/DevOps-Intro"

  tasks:
    - name: Create quicknotes system user
      ansible.builtin.user:
        name: quicknotes
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create QuickNotes data directory
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: quicknotes
        group: quicknotes
        mode: "0750"

    - name: Copy QuickNotes binary
      ansible.builtin.copy:
        src: files/quicknotes
        dest: /usr/local/bin/quicknotes
        owner: root
        group: root
        mode: "0755"
      notify: Restart quicknotes

    - name: Copy seed data
      ansible.builtin.copy:
        src: files/seed.json
        dest: "{{ seed_path }}"
        owner: quicknotes
        group: quicknotes
        mode: "0640"

    - name: Install QuickNotes systemd unit
      ansible.builtin.template:
        src: templates/quicknotes.service.j2
        dest: /etc/systemd/system/quicknotes.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart quicknotes

    - name: Enable and start QuickNotes
      ansible.builtin.systemd_service:
        name: quicknotes
        enabled: true
        state: started
        daemon_reload: true

    # Bonus: ansible-pull GitOps loop

    - name: Install Ansible and Git inside VM
      ansible.builtin.apt:
        name:
          - ansible-core
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Ansible configuration directory exists
      ansible.builtin.file:
        path: /etc/ansible
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install local Ansible inventory
      ansible.builtin.copy:
        src: files/local-inventory.ini
        dest: "{{ ansible_pull_inventory }}"
        owner: root
        group: root
        mode: "0644"

    - name: Create ansible-pull working directory
      ansible.builtin.file:
        path: /var/lib/ansible-pull
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install ansible-pull systemd service
      ansible.builtin.template:
        src: templates/ansible-pull.service.j2
        dest: /etc/systemd/system/ansible-pull.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart ansible-pull timer

    - name: Install ansible-pull systemd timer
      ansible.builtin.template:
        src: templates/ansible-pull.timer.j2
        dest: /etc/systemd/system/ansible-pull.timer
        owner: root
        group: root
        mode: "0644"
      notify: Restart ansible-pull timer

    - name: Enable and start ansible-pull timer
      ansible.builtin.systemd_service:
        name: ansible-pull.timer
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart quicknotes
      ansible.builtin.systemd_service:
        name: quicknotes
        state: restarted
        daemon_reload: true

    - name: Restart ansible-pull timer
      ansible.builtin.systemd_service:
        name: ansible-pull.timer
        state: restarted
        daemon_reload: true
