---
- name: Deploy QuickNotes
  hosts: quicknotes
  become: true
  gather_facts: false

  vars:
    quicknotes_user: quicknotes
    quicknotes_group: quicknotes
    quicknotes_data_dir: /var/lib/quicknotes
    quicknotes_binary_path: /usr/local/bin/quicknotes
    quicknotes_service_name: quicknotes.service
    listen_addr: ":8080"
    data_path: "{{ quicknotes_data_dir }}/notes.json"
    seed_path: "{{ quicknotes_data_dir }}/seed.json"
    restart_delay: 3s

    configure_ansible_pull: true
    ansible_pull_repo: https://github.com/ttrlen/DevOps-Intro.git
    ansible_pull_branch: feature/lab7
    ansible_pull_checkout_dir: /opt/quicknotes-ansible
    ansible_pull_inventory_path: /etc/ansible/quicknotes-pull.inventory
    ansible_pull_playbook: ansible/playbook.yaml

  tasks:
    - name: Create the QuickNotes system group
      ansible.builtin.group:
        name: "{{ quicknotes_group }}"
        system: true
        state: present

    - name: Create the QuickNotes system user
      ansible.builtin.user:
        name: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create the QuickNotes data directory
      ansible.builtin.file:
        path: "{{ quicknotes_data_dir }}"
        state: directory
        owner: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        mode: "0750"

    - name: Install the QuickNotes binary
      ansible.builtin.copy:
        src: files/quicknotes
        dest: "{{ quicknotes_binary_path }}"
        owner: root
        group: root
        mode: "0755"
      notify: restart quicknotes

    - name: Install the QuickNotes seed data
      ansible.builtin.copy:
        src: files/seed.json
        dest: "{{ seed_path }}"
        owner: "{{ quicknotes_user }}"
        group: "{{ quicknotes_group }}"
        mode: "0640"

    - name: Render the QuickNotes systemd unit
      ansible.builtin.template:
        src: quicknotes.service.j2
        dest: "/etc/systemd/system/{{ quicknotes_service_name }}"
        owner: root
        group: root
        mode: "0644"
      notify: restart quicknotes

    - name: Ensure QuickNotes is enabled and running
      ansible.builtin.systemd:
        name: "{{ quicknotes_service_name }}"
        daemon_reload: true
        enabled: true
        state: started

    - name: Install Ansible and Git for ansible-pull
      ansible.builtin.apt:
        name:
          - ansible
          - git
        state: present
        update_cache: true
      when: configure_ansible_pull | bool

    - name: Create the ansible-pull configuration directory
      ansible.builtin.file:
        path: /etc/ansible
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: configure_ansible_pull | bool

    - name: Install the local ansible-pull inventory
      ansible.builtin.template:
        src: ansible-pull.inventory.j2
        dest: "{{ ansible_pull_inventory_path }}"
        owner: root
        group: root
        mode: "0644"
      when: configure_ansible_pull | bool

    - name: Install the ansible-pull systemd service
      ansible.builtin.template:
        src: ansible-pull.service.j2
        dest: /etc/systemd/system/ansible-pull.service
        owner: root
        group: root
        mode: "0644"
      when: configure_ansible_pull | bool

    - name: Install the ansible-pull systemd timer
      ansible.builtin.template:
        src: ansible-pull.timer.j2
        dest: /etc/systemd/system/ansible-pull.timer
        owner: root
        group: root
        mode: "0644"
      when: configure_ansible_pull | bool

    - name: Enable and start the ansible-pull timer
      ansible.builtin.systemd:
        name: ansible-pull.timer
        daemon_reload: true
        enabled: true
        state: started
      when: configure_ansible_pull | bool

  handlers:
    - name: restart quicknotes
      ansible.builtin.systemd:
        name: "{{ quicknotes_service_name }}"
        daemon_reload: true
        state: restarted
