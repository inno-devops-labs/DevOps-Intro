groups:
  - name: quicknotes-alerts
    rules:
      - alert: QuickNotesHighErrorRate
        expr: |
          sum(rate(quicknotes_http_responses_by_code_total{code=~"4..|5.."}[2m]))
          /
          clamp_min(sum(rate(quicknotes_http_requests_total[2m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: More than 5% of QuickNotes requests return 4xx or 5xx
          runbook_url: https://github.com/4rni4ka/DevOps-Intro/blob/feature/lab8/docs/runbook/high-error-rate.md
