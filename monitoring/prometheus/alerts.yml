groups:
  - name: quicknotes
    rules:
      - alert: QuickNotesHighErrorRate
        expr: |
          sum(rate(quicknotes_http_responses_by_code_total{code=~"4..|5.."}[1m]))
          / clamp_min(sum(rate(quicknotes_http_requests_total[1m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: QuickNotes has more than 5% HTTP errors
          description: The ratio of 4xx and 5xx responses to all requests has stayed above 5% for five minutes.
          runbook: docs/runbook/high-error-rate.md
