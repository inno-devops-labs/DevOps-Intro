groups:
  - name: quicknotes
    interval: 15s
    rules:
      - alert: QuickNotesHighErrorRate
        expr: |
          sum(rate(quicknotes_http_responses_by_code_total{code=~"[45].."}[2m]))
          /
          clamp_min(sum(rate(quicknotes_http_responses_by_code_total[2m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: QuickNotes error ratio is above 5%
          description: More than 5% of QuickNotes responses have been 4xx or 5xx for five minutes.
          runbook_url: https://github.com/sonder314/DevOps-Intro/blob/feature/lab8/docs/runbook/high-error-rate.md
