groups:
  - name: quicknotes
    rules:
      - alert: QuickNotesHighErrorRate
        expr: |
          (
            sum(rate(quicknotes_http_responses_by_code_total{job="quicknotes",code=~"4..|5.."}[1m]))
            /
            sum(rate(quicknotes_http_requests_total{job="quicknotes"}[1m]))
          ) > 0.05
        for: 5m
        labels:
          severity: page
          service: quicknotes
        annotations:
          summary: "QuickNotes error ratio exceeds 5%"
          description: "The 1-minute ratio of HTTP 4xx and 5xx responses has remained above 5% for 5 minutes."
          runbook_path: "docs/runbook/high-error-rate.md"
          runbook_url: "https://github.com/amiranabiullina/DevOps-Intro/blob/feature/lab8/docs/runbook/high-error-rate.md"
